<!DOCTYPE html>
<html>
<head>
  <title>K-Blow ZM Music</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0d0d0d;
      color: white;
      text-align: center;
    }

    header {
      background: black;
      padding: 20px;
    }

    h1 {
      color: #00ffcc;
    }

    .search {
      margin: 20px;
    }

    input {
      padding: 10px;
      width: 80%;
      border-radius: 10px;
      border: none;
    }

    .song {
      background: #1a1a1a;
      margin: 15px;
      padding: 15px;
      border-radius: 10px;
    }

    iframe {
      width: 100%;
      height: 200px;
      border-radius: 10px;
    }

    audio {
      width: 100%;
      margin-top: 10px;
    }

    .btn {
      display: inline-block;
      margin: 8px;
      padding: 10px 15px;
      border-radius: 8px;
      color: white;
      text-decoration: none;
    }

    .download { background: green; }
    .listen { background: red; }

    footer {
      padding: 20px;
      background: black;
    }
  </style>
</head>

<body>

<header>
  <h1>🎤 K-Blow ZM</h1>
  <p>Official Music Platform 🔥</p>
</header>

<div class="search">
  <input type="text" id="search" placeholder="Search songs...">
</div>

<div id="songs"></div>

<footer>
  <h2>Follow Me 🔥</h2>

  <a href="https://wa.me/260762683197" class="btn download">WhatsApp</a>
  <a href="https://tiktok.com/@kblowzm" class="btn listen">TikTok</a>
  <a href="https://youtube.com/@kblowzm" class="btn download">YouTube</a>

  <p>© 2026 K-Blow ZM</p>
</footer>

<script>
const songs = [
  {
    title: "You Are My Medicine 💊",
    file: "Song1.mp3",
    youtube: "YOUR_VIDEO_ID"
  }
];

function displaySongs(list) {
  const container = document.getElementById("songs");
  container.innerHTML = "";

  list.forEach(song => {
    container.innerHTML += `
      <div class="song">
        <h3>${song.title}</h3>

        <!-- YouTube -->
        <iframe src="https://www.youtube.com/embed/${song.youtube}" allowfullscreen></iframe>

        <!-- MP3 -->
        <audio controls>
          <source src="${song.file}" type="audio/mpeg">
        </audio>

        <br>
        <a href="${song.file}" download class="btn download">⬇ Download</a>
        <a href="https://www.youtube.com/watch?v=${song.youtube}" class="btn listen">▶ Watch on YouTube</a>
      </div>
    `;
  });
}

displaySongs(songs);

document.getElementById("search").addEventListener("input", function() {
  const value = this.value.toLowerCase();

  const filtered = songs.filter(song =>
    song.title.toLowerCase().includes(value)
  );

  displaySongs(filtered);
});
</script>

</body>
</html>
